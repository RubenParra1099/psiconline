<style>
/* Layout: sticky brand bar + role tabs; the user flow lives in a phone-width column, clinical views use a wide two-pane / grid layout. */
:root{
  --navy:#1B2B4B; --wine:#8A2846; --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#EEF0F5;
  --ink:#16203A; --muted:#5B6479; --line:#DCE0E8;
  --verde:#00918A; --amarillo:#D69A00; --rojo:#D0364F;
  --verde-bg:#DDF2F0; --amarillo-bg:#FBF1D6; --rojo-bg:#FAE1E5;
  --verde-ink:#00706A; --amarillo-ink:#8A6300; --rojo-ink:#A8233B;
  --on-verde:#FFFFFF; --on-amarillo:#16203A; --on-rojo:#FFFFFF; --on-na:#16203A;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --hub:#2c3d66; --hub-hi:#9fb2db; --hub-lo:#0b1226; --grid:#E6E9EF; --axis:#C5CBD6;
  --o1:#184f95; --o2:#1c5cab; --o3:#256abf; --o4:#2a78d6; --o5:#5598e7; --o6:#86b6ef;
  --accent:var(--wine); --accent-ink:#FFFFFF; --head:var(--navy); --head-ink:#FFFFFF;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-voice:"Newsreader",Georgia,"Times New Roman",serif;
  --f-data:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#9FB4E0; --wine:#E07A98; --bg:#0F1422; --surface:#171E30; --surface-2:#1F2840;
  --ink:#E7EBF4; --muted:#9AA4BB; --line:#2C3650;
  --verde:#1A9A98; --amarillo:#BF880C; --rojo:#DD4A5C;
  --verde-bg:#133536; --amarillo-bg:#3A3015; --rojo-bg:#3D1C24;
  --verde-ink:#4FC9C2; --amarillo-ink:#E6B44A; --rojo-ink:#F07A88;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --hub:#c3cde3; --hub-hi:#ffffff; --hub-lo:#5d6a88; --grid:#253048; --axis:#36425E;
  --o1:#86b6ef; --o2:#6da7ec; --o3:#5598e7; --o4:#3987e5; --o5:#2a78d6; --o6:#256abf;
  --accent:#E07A98; --accent-ink:#1A0C12; --head:#121A2D; --head-ink:#E7EBF4; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#9FB4E0; --wine:#E07A98; --bg:#0F1422; --surface:#171E30; --surface-2:#1F2840;
  --ink:#E7EBF4; --muted:#9AA4BB; --line:#2C3650;
  --verde:#1A9A98; --amarillo:#BF880C; --rojo:#DD4A5C;
  --verde-bg:#133536; --amarillo-bg:#3A3015; --rojo-bg:#3D1C24;
  --verde-ink:#4FC9C2; --amarillo-ink:#E6B44A; --rojo-ink:#F07A88;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --hub:#c3cde3; --hub-hi:#ffffff; --hub-lo:#5d6a88; --grid:#253048; --axis:#36425E;
  --o1:#86b6ef; --o2:#6da7ec; --o3:#5598e7; --o4:#3987e5; --o5:#2a78d6; --o6:#256abf;
  --accent:#E07A98; --accent-ink:#1A0C12; --head:#121A2D; --head-ink:#E7EBF4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--head);color:var(--head-ink)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.modpill{margin-left:auto;font-weight:700;font-size:14px;padding:6px 12px;border-radius:8px;background:color-mix(in srgb,var(--head-ink) 14%,transparent)}
.demo-pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--head-ink) 16%,transparent)}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
nav.tabs button{background:transparent;border:0;color:var(--head-ink);opacity:.72;padding:8px 12px;border-radius:8px;white-space:nowrap;font-weight:600;font-size:14px}
nav.tabs button[aria-current="true"]{opacity:1;background:color-mix(in srgb,var(--head-ink) 14%,transparent)}
main{max-width:1280px;margin:0 auto;padding-block:24px 64px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:var(--r);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.lv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.lv::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.lv.rojo::before{background:var(--rojo)} .lv.amarillo::before{background:var(--amarillo)} .lv.verde::before{background:var(--verde)}
.lv.rojo{color:var(--rojo-ink);background:var(--rojo-bg)} .lv.amarillo{color:var(--amarillo-ink);background:var(--amarillo-bg)} .lv.verde{color:var(--verde-ink);background:var(--verde-bg)} .lv.na{color:var(--muted);background:var(--surface-2)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=email],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;font-weight:400}
textarea{resize:vertical;min-height:84px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.note-ai{border-left:3px solid var(--navy);background:var(--surface-2);padding:12px 14px;border-radius:0 10px 10px 0;font-size:14px;white-space:pre-wrap}
.crisis{border:1px solid var(--rojo);background:var(--rojo-bg);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.crisis b.tel{font-family:var(--f-data);font-size:20px;letter-spacing:.02em;user-select:all}
.tabnum{font-variant-numeric:tabular-nums}

/* ---------- user flow (phone column) ---------- */
.phone{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero-q{font-family:var(--f-voice);font-size:clamp(26px,6vw,34px);font-weight:500;line-height:1.15;letter-spacing:-.01em}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:12px;border-radius:var(--r);text-align:left}
.seg button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.seg small{display:block;color:var(--muted);font-size:12px}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px}
.qtext{font-family:var(--f-voice);font-size:23px;line-height:1.3}
.scale{display:flex;flex-direction:column;gap:8px}
.scale button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;font-weight:600}
.scale button .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-data);font-size:14px;color:var(--surface);flex:none}
.scale button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.gauge{display:flex;flex-direction:column;align-items:center;gap:4px}
.gnum{font-family:var(--f-data);font-size:38px;font-weight:700;line-height:1;margin-top:-6px}
.gauge svg{width:100%;max-width:300px;height:auto}
.dimbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.dimbar .name{font-weight:600;font-size:14px;min-width:0}
.dimbar .name small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.dimbar .track{grid-column:1/-1;height:10px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.dimbar .track i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.dimbar .val{font-family:var(--f-data);font-size:13px}
.thresh{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.opt-card{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;width:100%}
.opt-card .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--accent);font-weight:800}
.opt-card b{display:block;font-size:16px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:320px}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:15px;white-space:pre-wrap}
.msg.noa{align-self:flex-start;background:var(--surface);border:1px solid var(--line);font-family:var(--f-voice);font-size:17px;line-height:1.4;border-bottom-left-radius:4px}
.msg.yo{align-self:flex-end;background:var(--navy);color:var(--bg);border-bottom-right-radius:4px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;height:48px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:center;min-width:64px}
.days button[aria-pressed="true"],.slots button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.days small{display:block;font-size:11px;opacity:.8}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slots button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-family:var(--f-data);font-size:13px}
.slots button:disabled{opacity:.35;text-decoration:line-through}

/* ---------- clinical views ---------- */
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.plist{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 210px);overflow:auto}
@media (max-width:900px){.plist{max-height:none}}
.pitem{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px 10px 0;text-align:left;width:100%}
.pitem[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pitem .stripe{align-self:stretch;border-radius:0 4px 4px 0}
.pitem b{display:block;font-size:14px}
.pitem .ice{font-family:var(--f-data);font-size:18px;text-align:right}
.pitem .ice small{display:block;font-family:var(--f-ui);font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h3{font-size:16px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.item .v{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-data);font-weight:500;color:var(--surface);font-size:13px}
.transcript{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:14px}
.transcript p b{color:var(--accent)}
.signal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.signal q{font-family:var(--f-voice);font-style:italic;color:var(--muted);grid-column:2}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.fbar select{width:auto;max-width:100%}
.kgrid{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1100px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.kgrid .hero{grid-column:1/-1}}
@media (max-width:480px){.kgrid{grid-template-columns:minmax(0,1fr)}}
.hero{display:flex;flex-direction:column;gap:6px}
.hero .k,.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.hero .hv{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted)}
.vgrid{display:grid;gap:16px;margin-bottom:16px}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:960px){.g21,.g11{grid-template-columns:minmax(0,1fr)}}
section.vcard{margin-bottom:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.vgrid>section.vcard{margin-bottom:0}
.vc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.vc-h h3{font-size:16px}
.btn.sm{padding:5px 10px;font-size:12px;flex:none}
.btn.sm[aria-pressed="true"]{background:var(--surface-2)}
.viz{width:100%;min-width:0}
.viz svg{display:block}
.chart text{font-family:var(--f-ui);font-size:11px;fill:var(--muted)}
.chart .tk{font-variant-numeric:tabular-nums}
.chart .zl{font-size:11px;font-weight:600;fill:var(--muted)}
.chart .ql{font-size:13px;font-weight:800;fill:var(--rojo-ink)}
.chart .el{font-size:14px;font-weight:700;fill:var(--ink)}
.chart .muted-t{fill:var(--muted);font-weight:600}
.chart .rl{font-size:12px;fill:var(--ink);opacity:.85}
.chart .at{font-size:12px;font-weight:600;fill:var(--muted)}
.chart .halo{paint-order:stroke;stroke:var(--rojo-bg);stroke-width:4px;stroke-linejoin:round}
.chart .mk{transition:opacity .12s}
.chart .mk:hover,.chart .mk:focus{opacity:.78;outline:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend span.ln::before{width:16px;height:2px;border-radius:2px}
.legend span.pt::before{border-radius:50%;width:9px;height:9px}
.legend span.plain::before{display:none}
.heat-wrap{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:2px;width:100%;min-width:900px}
table.heat th{font-size:11px;font-weight:700;color:var(--muted);text-align:left;vertical-align:bottom;padding:4px;line-height:1.2}
table.heat th.col{width:7.4%;text-align:center}
.hs{background:none;border:0;padding:2px;font:inherit;color:inherit;text-align:center;line-height:1.2}
.hs[aria-pressed="true"]{color:var(--ink)}
table.heat td.hc{height:44px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;border-radius:4px;cursor:default}
table.heat td.hc:hover,table.heat td.hc:focus{outline:2px solid var(--ink);outline-offset:-2px}
table.heat td.rowh{text-align:left;font-weight:600;font-size:13px;padding:0 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;cursor:pointer;white-space:nowrap}
table.heat tr[aria-selected="true"] td.rowh{border-color:var(--accent);color:var(--accent)}
table.heat tr.tot td.rowh{cursor:default;background:var(--surface-2)}
.s100{display:flex;gap:2px;height:20px;margin-top:4px}
.s100 i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;min-width:2px;border-radius:2px;font-variant-numeric:tabular-nums}
.s100 i:first-child{border-radius:4px 2px 2px 4px}.s100 i:last-child{border-radius:2px 4px 4px 2px}.s100 i:only-child{border-radius:4px}
.dt-wrap{overflow-x:auto}
table.dt{border-collapse:collapse;width:100%;font-size:13px}
table.dt th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
table.dt td{padding:7px 8px;border-bottom:1px solid var(--line)}
table.dt td.num{font-variant-numeric:tabular-nums}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline}
.vtip{position:fixed;z-index:30;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 28px color-mix(in srgb,var(--ink) 18%,transparent);border-radius:10px;padding:8px 10px;font-size:12px;min-width:150px;max-width:280px;display:flex;flex-direction:column;gap:3px}
.vtip .th{font-weight:700;color:var(--muted);font-size:11px;margin-bottom:2px}
.vtip .tr{display:grid;grid-template-columns:12px auto minmax(0,1fr);gap:8px;align-items:center}

 if(q)vis=vis.filter(x=>((x.p.nombre||"anónimo")+" "+x.p.folio+" "+(x.p.comunidad||"")).toLowerCase().includes(q));
 const so=P.orden||"prio";vis.sort((a,b)=>so==="ise"?b.i.sol-a.i.sol:so==="cambio"?a.i.delta-b.i.delta:so==="contacto"?b.i.sinPulso-a.i.sinPulso:b.i.prio-a.i.prio);
 return vis.map(({p,i})=>`<button class="pitem" data-act="psel" data-v="${p.folio}" aria-current="${p.folio===P.sel}"><span class="stripe" style="background:${col(nivel(i.sol))}"></span>

  <span class="row" style="gap:4px;margin-top:4px">${p.alertaCrisis?'<span class="lv rojo">Crisis</span>':""}${i.rojoSinCita?'<span class="lv amarillo">Sin cita</span>':""}${i.vencido?'<span class="chip">Pulso vencido</span>':""}${i.citaProx?`<span class="chip">Cita ${fCorta(p.cita.dia)}</span>`:""}<span class="chip">${esc(p.estado||"Nuevo")}</span>${p.demo?"":'<span class="chip" style="color:var(--accent)">Capturado hoy</span>'}</span></span>
  <span class="pside">${spark(p.evaluaciones.map(e=>iceSol(e.ice)),{w:64,h:26,color:col(nivel(i.sol))})}<span class="ice tabnum">${i.sol}<small>${p.evaluaciones.length>1?(i.delta<=0?"▼"+(-i.delta):"▲"+i.delta):"ISE"}</small></span></span></button>`).join("")||`<p class="muted">Sin expedientes con este filtro.</p>`}
function vPsicologo(){const P=S.ps;const all=pacientes().map(p=>({p,i:casoInfo(p)}));
 if(!all.some(x=>x.p.folio===P.sel))P.sel=all.slice().sort((a,b)=>b.i.prio-a.i.prio)[0]?.p.folio;const sel=all.find(x=>x.p.folio===P.sel);S._P=sel||null;S._cross={};
 const k={crisis:all.filter(x=>x.p.alertaCrisis).length,rsc:all.filter(x=>x.i.rojoSinCita).length,citas:all.filter(x=>x.i.citaProx).length,venc:all.filter(x=>x.i.vencido).length,alta:all.filter(x=>x.p.estado==="Alta").length};
 const tiles=[["crisis","Alertas de crisis",k.crisis,"Contacto el mismo día","rojo"],["rsc","En rojo sin cita",k.rsc,"Hay que contactarlos","amarillo"],["citas","Citas en 7 días",k.citas,"Agenda próxima","s1"],["venc","Seguimiento vencido",k.venc,"Más de 14 días sin pulso","muted"],["alta","Altas",k.alta,"Cerrados en verde","verde"]];
 return `<div class="stack" style="gap:6px;margin-bottom:16px"><span class="eyebrow">Panel clínico · psicólogos autorizados</span><h1 style="font-size:26px">¿A quién atiendo primero y cómo va cada caso?</h1><p class="muted small">Toca cualquier dimensión, pregunta o punto de una gráfica para abrir su ficha técnica.</p></div>
 <div class="ctiles">${tiles.map(([key,t,n,s,c])=>`<button class="ctile" data-act="pf" data-v="${key}" aria-pressed="${P.filtro===key}" style="--c:var(--${c})"><span class="k">${t}</span><span class="v">${n}</span><span class="s">${s}</span></button>`).join("")}</div>
 <div class="split"><aside class="stack" style="gap:10px"><input type="text" id="ps-q" placeholder="Buscar por nombre, folio o comunidad" value="${esc(P.q||"")}" aria-label="Buscar expediente">
 <div class="row" style="gap:8px;flex-wrap:nowrap"><select id="ps-ord" aria-label="Ordenar"><option value="prio" ${P.orden==="prio"||!P.orden?"selected":""}>Prioridad clínica</option><option value="ise" ${P.orden==="ise"?"selected":""}>ISE más alto</option><option value="cambio" ${P.orden==="cambio"?"selected":""}>Mayor mejora</option><option value="contacto" ${P.orden==="contacto"?"selected":""}>Más días sin contacto</option></select></div>
 <div class="filters">${[["todos","Todos"],["rojo","Rojo"],["amarillo","Amarillo"],["verde","Verde"]].map(([kk,t])=>`<button data-act="pf" data-v="${kk}" aria-pressed="${P.filtro===kk}">${t}</button>`).join("")}</div>
 <div class="plist" id="plist">${plistHTML()}</div></aside><section style="min-width:0">${sel?detalle(sel):""}</section></div>`}

function detalle(x){const p=x.p,i=x.i,e=i.e;const tab=S.ps.tab||"resumen";const notas=S.notas[p.folio]||[];const foco=focoDe(p);const ai=S.ps.ai[p.folio];
 const tabs=[["resumen","Resumen"],["evolucion","Evolución"],["respuestas","Respuestas y Noa"],["sesion","Sesión de 20 min"],["notas",`Notas (${notas.length})`]];
 const head=`<div class="card stack" style="gap:16px">
 <div class="row" style="justify-content:space-between;align-items:flex-start"><div class="stack" style="gap:4px;min-width:0"><span class="eyebrow">Expediente ${esc(p.folio)}${p.demo?" · ejemplo":""}</span><h2 style="font-size:23px">${esc(p.nombre||"Anónimo (sin datos de contacto)")}</h2>
  <span class="muted small">${p.version==="adolescente"?"Adolescente · 12–17":"Adulto joven · 18–45"} · ${esc(p.comunidad||"Sin comunidad")} · ${p.evaluaciones.length} medición${p.evaluaciones.length>1?"es":""} desde ${fecha(p.evaluaciones[0].fecha)}${p.telefono||p.correo?` · ${esc([p.telefono,p.correo].filter(Boolean).join(" · "))}`:""}</span></div>
  <div class="row" style="gap:8px"><button class="btn primary sm" data-act="ptab" data-v="sesion">Iniciar sesión de 20 min</button><button class="btn sm" data-act="retest" data-v="${p.folio}">Simular pulso</button></div></div>
 ${p.alertaCrisis?`<div class="crisis" role="alert" style="flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap"><span><b>Protocolo de crisis activo.</b> Contactar hoy. Línea de la Vida <b class="tel" style="font-size:15px">800 911 2000</b> · emergencias 911.</span><button class="btn sm" data-act="ptab" data-v="respuestas">Ver lo que escribió</button></div>`:""}
 <div class="hstats">
  <div class="hs1 fk" data-ficha="kpi:pise" tabindex="0" role="button"><span class="k">ISE de soledad</span><div class="row" style="gap:10px;align-items:flex-end"><span class="hv">${i.sol}</span><span class="stack" style="gap:4px;padding-bottom:6px">${lv(i.sol)}${p.evaluaciones.length>1?`<span class="small" style="font-weight:700;color:${i.delta<0?"var(--verde-ink)":i.delta>0?"var(--rojo-ink)":"var(--muted)"}">${i.delta<0?"▼ "+(-i.delta):i.delta>0?"▲ +"+i.delta:"= 0"} desde el inicio</span>`:'<span class="muted small">Primera medición</span>'}</span></div></div>
  <div><span class="k">Dimensiones en rojo</span><div class="row" style="gap:8px;align-items:center"><span class="hv2">${i.rojos}<small>/10</small></span><span class="dstrip">${DIMS.map(d=>`<button class="fl dsq" data-ficha="dim:${d.k}" style="background:${col(nivel(e.ice[d.k]))}" aria-label="${esc(d.n)}: ${e.ice[d.k]}" ${tipA([{h:d.n},{v:e.ice[d.k],l:"ISE · "+NIVEL_TXT[nivel(e.ice[d.k])],c:col(nivel(e.ice[d.k]))}])}></button>`).join("")}</span></div></div>
  <div><span class="k">Foco actual</span><button class="fl hv3" data-ficha="dim:${foco}">${esc(DIM[foco].n)}</button><span class="muted small">ISE ${e.ice[foco]} · ${notas.length?"definido en la última nota":"sugerido por el semáforo"}</span></div>
  <div><span class="k">Próximo paso</span><span class="hv3">${p.cita?`Cita ${fCorta(p.cita.dia)} · ${esc(p.cita.hora)}`:p.estado==="Alta"?"Pulso mensual":"Agendar contacto"}</span><span class="muted small">${i.sinPulso===0?"Medido hoy":`Último pulso hace ${i.sinPulso} día${i.sinPulso===1?"":"s"}`}${i.vencido?' · <b style="color:var(--rojo-ink)">vencido</b>':""}</span></div></div></div>`;
 let body="";
 if(tab==="resumen")body=`<div class="grid2">
  <section class="card vcard"><div class="vc-h"><div><h3>Perfil ISE</h3><p class="muted small">${p.evaluaciones.length>1?"Barra: hoy · marca: medición anterior":"Primera medición"} · toca una dimensión</p></div></div><div class="viz" data-chart="pPerfil" style="min-height:330px"></div></section>
  <section class="card vcard"><div class="vc-h"><div><h3>Contra su comunidad</h3><p class="muted small">${esc(refNombre(p))} · banda = 50 % central</p></div></div>${legend([["var(--surface-2)","Rango típico (25–75 %)"],["var(--ink)","Mediana","ln"],["var(--rojo)","Paciente (color = nivel)","pt"]])}<div class="viz" data-chart="pCom" style="min-height:330px"></div></section></div>
  <section class="card vcard" style="margin-top:16px"><div class="vc-h"><div><h3>Línea de tiempo del caso</h3><p class="muted small">Mediciones, sesiones y contactos en un solo vistazo</p></div></div><div class="viz" data-chart="pTime" style="min-height:150px"></div></section>
  <div class="grid2" style="margin-top:16px"><section class="card stack"><div class="sec-h" style="margin:0"><h3>En sus palabras</h3></div>${palabras(p)}</section>
  <section class="card stack"><div class="sec-h" style="margin:0"><h3>Resumen asistido por IA</h3><button class="btn sm" data-act="ai" data-v="${p.folio}" ${ai==="…"?"disabled":""}>${ai&&ai!=="…"?"Regenerar":"Generar"}</button></div>${ai?`<div class="note-ai">${esc(ai)}</div>`:'<p class="muted small">Síntesis, foco sugerido y tres preguntas puntuales para 20 minutos. Hipótesis para validar, no diagnóstico.</p>'}</section></div>`;
 else if(tab==="evolucion"){const ef=S.ps.evFoco&&DIM[S.ps.evFoco]?S.ps.evFoco:foco;body=`<section class="card vcard"><div class="vc-h"><div><h3>ISE de soledad y dimensión en foco</h3><p class="muted small">Las marcas numeradas son sesiones registradas en notas</p></div>
  <select id="ev-foco" aria-label="Dimensión a comparar" style="width:auto">${DIMS.map(d=>`<option value="${d.k}" ${d.k===ef?"selected":""}>${esc(d.n)}</option>`).join("")}</select></div>
  ${legend([["var(--s1)","ISE de soledad","ln"],["var(--s2)",DIM[ef].n,"ln"],["var(--muted)","Sesión registrada","pt"]])}<div class="viz" data-chart="pEvol" style="min-height:280px"></div></section>
  <section class="card" style="margin-top:16px"><div class="sec-h"><h3>Las 10 dimensiones</h3><span class="muted small">Misma escala 0–100 · toca una para su ficha</span></div><div class="minis">${DIMS.map(d=>{const v=e.ice[d.k],f=p.evaluaciones[0].ice[d.k];return `<div class="mini fk" data-ficha="dim:${d.k}" tabindex="0" role="button"><div class="row" style="justify-content:space-between;gap:6px;flex-wrap:nowrap"><b class="small">${esc(SHORT[d.k])}</b>${lv(v,String(v))}</div><div class="viz" data-chart="pMini" data-k="${d.k}" style="min-height:70px"></div><span class="muted" style="font-size:11px">${p.evaluaciones.length>1?(v-f<=0?"▼ "+(f-v):"▲ +"+(v-f))+" desde el inicio":"1 medición"}</span></div>`}).join("")}</div></section>`}
 else if(tab==="respuestas")body=`<section class="card"><div class="sec-h"><h3>Mapa de respuestas</h3><span class="muted small">Cada celda es la respuesta (1 Nunca – 5 Siempre); el color es el riesgo, ya invertido en (R)</span></div>${mapaResp(p)}</section>
  <div class="grid2" style="margin-top:16px"><section class="card stack"><h3 style="font-size:16px">Respuestas abiertas</h3>${Object.entries(p.abiertas||{}).filter(([,v])=>v).map(([kk,v])=>`<div><button class="fl small muted" data-ficha="dim:${kk}">${esc(ABIERTAS[kk])}</button><p style="font-family:var(--f-voice);font-size:17px">“${esc(v)}”</p></div>`).join("")||'<p class="muted small">Sin respuestas abiertas todavía.</p>'}</section>
  <section class="card stack"><h3 style="font-size:16px">Conversación con Noa</h3>${p.chat&&p.chat.length?`<div class="transcript">${p.chat.map(([w,t])=>`<p ${CRISIS_RE.test(t)?'class="flag"':""}><b>${w==="yo"?"Usuario":"Noa"}:</b> ${esc(t)}</p>`).join("")}</div>`:'<p class="muted small">No ha conversado con Noa.</p>'}</section></div>${transcripcionesHTML(p)}`;
 else if(tab==="sesion")body=sesionHTML(p,foco);
 else body=notasHTML(p,foco,notas);
 return `<div class="stack">${head}<div class="subtabs" role="tablist" style="margin:0">${tabs.map(([kk,t])=>`<button role="tab" data-act="ptab" data-v="${kk}" aria-selected="${tab===kk}">${t}</button>`).join("")}</div>${body}</div>`}
function palabras(p){const ab=Object.entries(p.abiertas||{}).filter(([,v])=>v).slice(0,2);const ch=(p.chat||[]).filter(m=>m[0]==="yo").slice(-2);
 if(!ab.length&&!ch.length)return '<p class="muted small">Todavía no hay respuestas abiertas ni conversación con Noa.</p>';
 return ab.map(([k,v])=>`<div><span class="chip">${esc(SHORT[k])}</span><p style="font-family:var(--f-voice);font-size:17px;margin-top:4px">“${esc(v)}”</p></div>`).join("")+ch.map(m=>`<div><span class="chip">Con Noa</span><p style="font-family:var(--f-voice);font-size:17px;margin-top:4px">“${esc(m[1])}”</p></div>`).join("")}
function refNombre(p){const g=cohorte().filter(x=>x.comunidad===p.comunidad);return g.length>=10?p.comunidad:(p.version==="adolescente"?"Adolescentes del piloto":"Adultos jóvenes del piloto")}
function refGrupo(p){const all=cohorte();const g=all.filter(x=>x.comunidad===p.comunidad);return g.length>=10?g:all.filter(x=>x.version===p.version)}
function pct(arr,v){const a=arr.filter(x=>x!=null);return a.length?Math.round(a.filter(x=>x<v).length/a.length*100):null}
function quart(arr){const a=arr.filter(x=>x!=null).sort((x,y)=>x-y);const q=f=>a[Math.min(a.length-1,Math.floor(f*(a.length-1)))];return a.length?{p25:q(.25),med:q(.5),p75:q(.75)}:null}
function mapaResp(p){const ev=p.evaluaciones;const ids=[...new Set(ev.flatMap(e=>Object.keys(e.respuestas).map(Number)))].sort((a,b)=>a-b);
 return `<div class="dt-wrap"><table class="rmap"><thead><tr><th>Pregunta</th>${ev.map(e=>`<th class="c">${fCorta(e.fecha)}</th>`).join("")}<th class="c">Cambio</th></tr></thead><tbody>
 ${DIMS.map(d=>{const its=ids.filter(id=>QID[id].d===d.k);if(!its.length)return"";return `<tr class="grp"><td colspan="${ev.length+2}"><button class="fl" data-ficha="dim:${d.k}">${esc(d.n)}</button> <span class="lv ${nivel(ultima(p).ice[d.k])}">${ultima(p).ice[d.k]}</span></td></tr>`+its.map(id=>{const q=QID[id];const rs=ev.map(e=>e.respuestas[id]?riesgo(q,e.respuestas[id]):null);const f=rs.find(x=>x!=null),l=rs[rs.length-1];const dl=l!=null&&f!=null?l-f:null;
  return `<tr><td><button class="fl qlink" data-ficha="item:${id}"><span class="muted tabnum">${id}${q.r?" (R)":""}</span> ${esc(qtxt(q))}</button></td>${ev.map(e=>{const v=e.respuestas[id];if(!v)return '<td class="c">–</td>';const l2=nivel((riesgo(q,v)-1)/4*100);return `<td class="c"><span class="rc" style="background:var(--${l2});color:var(--on-${l2})" ${tipA([{h:fecha(e.fecha)},{v:v+" · "+SCALE[v-1][1],l:"respuesta",c:`var(--${l2})`},{v:riesgo(q,v),l:"riesgo de 1 a 5"}])}>${v}</span></td>`}).join("")}
  <td class="c tabnum" style="font-weight:700;color:${dl<0?"var(--verde-ink)":dl>0?"var(--rojo-ink)":"var(--muted)"}">${dl==null||ev.length<2?"–":dl<0?"▼"+(-dl):dl>0?"▲"+dl:"="}</td></tr>`}).join("")}).join("")}</tbody></table></div>`}
const TAREAS={emo:"Escribirle a una persona de confianza algo real de su semana, no solo «todo bien».",soc:"Elegir una actividad en grupo pequeña (club, equipo, taller) y asistir una vez.",ret:"Responder un mensaje pendiente de alguien cercano y proponer verse.",exp:"Nombrar una emoción al día con una palabra precisa (no «bien» ni «mal»).",ver:"Pausar 3 días las cuentas que disparan comparación y anotar cómo se siente.",cie:"Platicar 10 minutos con alguien que piensa distinto, solo escuchando.",red:"Poner límite de tiempo a la app que más usa y notar el antes y el después.",sus:"Cambiar una conversación con una app o chatbot por una con una persona.",esc:"Pedir a alguien 10 minutos sin celular para contarle algo y decirle que solo necesita que le escuche.",con:"Una comida a la semana sin pantallas con familia o amistades."};
const PREG2={emo:"¿Con quién sí te sientes un poco más tú, aunque sea a ratos?",soc:"¿Dónde has sentido, aunque sea una vez, que sí encajas?",ret:"¿Qué tendría que pasar para que te animaras a buscar a esa persona?",exp:"Si tu emoción de esta semana tuviera nombre, ¿cuál sería?",ver:"¿Qué te dices a ti mismo/a justo después de ver esas publicaciones?",cie:"¿Qué perderías y qué ganarías si volvieras a convivir con esa persona?",red:"¿Cómo te sientes justo antes de abrir la app y cómo justo después?",sus:"¿Qué tendría que tener una persona para darte lo que hoy te da la app?",esc:"¿Qué necesitas de alguien cuando le cuentas algo: consejo o solo que te escuche?",con:"¿Qué conversación sin celular recuerdas con gusto de este mes?"};
function sesionHTML(p,foco){const sf=S.ps.sesFoco&&DIM[S.ps.sesFoco]?S.ps.sesFoco:foco;const e=ultima(p);const tx=S.ps.tx[p.folio]||{};const T=S.ps.timer;const secs=Math.max(0,1200-Math.floor(tElapsed()/1000));
 const pre=[ABIERTAS[sf],PREG2[sf],"¿Qué persona concreta podrías buscar esta semana y qué te detiene?"];
 return `<div class="ses"><section class="card stack"><div class="sec-h" style="margin:0"><h3>Plan de la sesión</h3><span class="muted small">Generado con el semáforo; ajústalo</span></div>

 <section class="card stack"><div class="sec-h" style="margin:0"><h3>En sesión</h3><span class="muted small">Intervención breve</span></div>
  <div class="timer"><span id="ses-clock" class="clock tabnum ${secs<=120?"low":""}">${String(Math.floor(secs/60)).padStart(2,"0")}:${String(secs%60).padStart(2,"0")}</span>
  <div class="row" style="gap:8px;justify-content:center">${T.running?'<button class="btn sm" data-act="tPause">Pausar</button>':`<button class="btn primary sm" data-act="tStart">${T.acc?"Reanudar":"Iniciar 20 min"}</button>`}<button class="btn ghost sm" data-act="tReset">Reiniciar</button></div></div>
  <label class="f">Notas de la sesión<textarea id="ses-nota" rows="6" placeholder="Qué trajo, qué se movió, qué acordaron.">${esc(S.ps.sesNota||"")}</textarea></label>
  <label class="f">Decisión<select id="ses-dec">${["Seguimiento","Intervención breve (20 min)","Derivar a grupo de apoyo","Escalar · protocolo de crisis","Alta"].map(o=>`<option>${o}</option>`).join("")}</select></label>
  <button class="btn primary" data-act="sesSave" data-v="${p.folio}">Terminar y guardar en el expediente</button></section></div>
 ${noaSesionHTML(p)}`}
function notasHTML(p,foco,notas){const e=ultima(p);return `<div class="grid2"><section class="card stack"><h3 style="font-size:16px">Nueva nota</h3>
 <label class="f">Foco de intervención<select id="n-foco">${DIMS.map(d=>`<option value="${d.k}" ${d.k===foco?"selected":""}>${esc(d.n)} · ${e.ice[d.k]}</option>`).join("")}</select></label>

const SEM0=new Date(2026,7,17),NSEM=10;
const semLbl=i=>new Date(SEM0.getTime()+i*7*864e5).toLocaleDateString("es-MX",{day:"numeric",month:"short"}).replace(".","");
const avg=a=>{const b=a.filter(x=>x!=null);return b.length?Math.round(b.reduce((x,y)=>x+y,0)/b.length):null};
function pearson(xs,ys){const n=xs.length;if(n<3)return 0;const mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let sxy=0,sx=0,sy=0;for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sx+=dx*dx;sy+=dy*dy}return sx&&sy?sxy/Math.sqrt(sx*sy):0}
function niceMax(m){for(const s of [1,2,5,10,20,25,50,100,200]){if(m/s<=5)return{max:Math.max(s,Math.ceil(m/s)*s),step:s}}return{max:Math.ceil(m/500)*500,step:500}}

function roundTop(x,y,w,h,r){r=Math.min(r,h,w/2);return `M${x} ${y+h}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h}Z`}
function roundRight(x,y,w,h,r){r=Math.min(r,w,h/2);return `M${x} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h-r}Q${x+w} ${y+h} ${x+w-r} ${y+h}H${x}Z`}

 f:{exp:!!p.nombre,noa:!!(p.chat&&p.chat.length),cita:!!p.cita,seg:p.estado==="En seguimiento",alta:p.estado==="Alta"}}});return SIM.concat(live)}

 const scope=all.filter(x=>okV(x)&&okR(x)&&okC(x)),ref=all.filter(x=>okV(x)&&okR(x));
 const coms=[...new Set(all.map(x=>x.comunidad))];
 const nombre=T.com==="todas"?(T.ver==="todas"?"Todas las comunidades":T.ver==="adolescente"?"Adolescentes":"Adultos jóvenes"):T.com;
 return{T,all,scope,ref,coms,nombre,okV,okR}}
function spark(vals,{w=120,h=34,color="var(--s1)"}={}){const pts=vals.map((v,i)=>[i,v]).filter(p=>p[1]!=null);if(pts.length<2)return"";const mn=Math.min(...pts.map(p=>p[1])),mx=Math.max(...pts.map(p=>p[1]));const X=i=>3+i*(w-6)/(vals.length-1),Y=v=>3+(mx===mn?.5:(mx-v)/(mx-mn))*(h-6);
 const d=pts.map((p,j)=>(j?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");const l=pts[pts.length-1];
 return `<svg width="${w}" height="${h}" aria-hidden="true" style="overflow:visible"><path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(l[0])}" cy="${Y(l[1])}" r="3.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/></svg>`}

function showTip(rows,x,y){vtip.replaceChildren(...rows.map(r=>{const d=document.createElement("div");if(r.h){d.className="th";d.textContent=r.h;return d}d.className="tr";const k=document.createElement("i");if(r.c)k.style.background=r.c;else k.style.visibility="hidden";const b=document.createElement("b");b.textContent=r.v;const s=document.createElement("span");s.textContent=r.l;d.append(k,b,s);return d}));

function clearCross(){document.querySelectorAll("[data-xline],[data-ring]").forEach(e=>e.setAttribute("opacity","0"))}
function hideTip(){vtip.hidden=true;clearCross()}
function handleCross(t,e){const C=S._cross?.[t.dataset.cross];if(!C)return;const svg=t.ownerSVGElement,box=svg.getBoundingClientRect(),x=e.clientX-box.left,y=e.clientY-box.top;const ring=svg.querySelector("[data-ring]");
 if(C.type==="x"){const i=Math.max(0,Math.min(C.n-1,Math.round((x-C.x0)/C.step)));const px=C.x0+i*C.step,xl=svg.querySelector("[data-xline]");xl.setAttribute("x1",px);xl.setAttribute("x2",px);xl.setAttribute("opacity",".35");const yy=C.y(i);if(ring&&yy!=null){ring.setAttribute("cx",px);ring.setAttribute("cy",yy);ring.setAttribute("opacity","1")}else ring?.setAttribute("opacity","0");showTip(C.rows(i),e.clientX,e.clientY)}
 else if(C.type==="xs"){let i=0,bd=1e9;C.xs.forEach((v,j)=>{const d=Math.abs(v-x);if(d<bd){bd=d;i=j}});const xl=svg.querySelector("[data-xline]");xl.setAttribute("x1",C.xs[i]);xl.setAttribute("x2",C.xs[i]);xl.setAttribute("opacity",".35");ring.setAttribute("cx",C.xs[i]);ring.setAttribute("cy",C.y(i));ring.setAttribute("opacity","1");showTip(C.rows(i),e.clientX,e.clientY)}
 else{let best=null,bd=24*24;for(const p of C.pts){const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;best=p}}S._near=best;if(best){ring.setAttribute("cx",best.x);ring.setAttribute("cy",best.y);ring.setAttribute("opacity","1");showTip(C.rows(best),e.clientX,e.clientY)}else{ring.setAttribute("opacity","0");vtip.hidden=true}}}

 ${fsec("Qué hacer con este grupo",`<ul class="fl-ul">${k==="sol"?"<li>Priorizar a los "+sil+" silenciosos (soledad y falta de escucha en rojo) para contacto individual.</li><li>Aplicar charla grupal y repetir el cribado para medir el efecto.</li>":DIM_INFO[k].ideas.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${k!=="sol"?`<p class="small"><b>Módulo de apoyo:</b> ${esc(DIM_INFO[k].mod)}</p>`:""}`)}
 <div class="row" style="gap:8px;margin-top:12px">${k!=="sol"?`<button class="btn sm" data-ficha="dim:${k}">Ficha de la dimensión</button>`:""}${com!=="todas"?`<button class="btn sm" data-fgo="com:${esc(com)}">Filtrar el tablero por esta comunidad</button>`:""}</div>`}
const KPI_DEF={
 ise:{t:"ISE de soledad promedio",def:"Índice de Saturación Emocional del resultado principal: promedio de soledad emocional, social y retraimiento de la red, en escala 0–100.",calc:"Por persona: cada respuesta se convierte a riesgo (1–5, invirtiendo las (R) y las dimensiones protectoras), se promedia por dimensión y se lleva a 0–100. El ISE de soledad promedia las tres dimensiones de resultado. Los factores no se suman en una sola calificación.",f:x=>x.sol,agg:"avg"},
 cribados:{t:"Cribados aplicados",def:"Número de cuestionarios completados en el periodo y filtros elegidos.",calc:"Cada cribado anónimo cuenta, haya o no abierto expediente.",f:()=>1,agg:"count"},
 rojo:{t:"En rojo de soledad",def:"Porcentaje de personas con ISE de soledad de 60 o más.",calc:"Personas con ISE de soledad ≥ 60 ÷ cribados. Corte provisional hasta validar con datos propios.",f:x=>x.sol>=60?100:0,agg:"avg"},
 silenciosos:{t:"Silenciosos",def:"Personas con soledad, falta de escucha recibida y dificultad para expresar emociones, las tres en rojo. Son los que no levantan la mano en una plática.",calc:"ISE soledad ≥ 60 y ISE escucha recibida ≥ 60 y ISE expresar emociones ≥ 60.",f:x=>x.sol>=60&&x.ice.esc>=60&&x.ice.exp>=60?1:0,agg:"sum"},
 expediente:{t:"Abrieron expediente",def:"Porcentaje de personas que, después de ver su resultado, dejaron sus datos para dar seguimiento.",calc:"Expedientes abiertos ÷ cribados. Es la conversión del cribado anónimo a atención.",f:x=>x.f.exp?100:0,agg:"avg"},
 pise:{t:"ISE de soledad del paciente",def:"Resultado principal de este expediente: soledad emocional, social y retraimiento de la red.",calc:"Promedio de las tres dimensiones de resultado, 0–100. Verde < 35, amarillo 35–59, rojo ≥ 60 (provisional)."}};
function fKpi(key){const K=KPI_DEF[key];if(key==="pise"){const p=S._P.p;return `<h2 class="ftitle">${K.t}</h2><p>${esc(K.def)}</p>${fLine(p.evaluaciones.map(e=>iceSol(e.ice)),p.evaluaciones.map(e=>fCorta(e.fecha)))}${fsec("Componentes hoy",fBars(["emo","soc","ret"].map(k=>({l:DIM[k].n,v:ultima(p).ice[k],fk:"dim:"+k}))))}${fsec("Cómo se calcula",`<p class="small">${esc(K.calc)}</p>`+nivTabla(),false)}`}
 const M=S._M;const agg=g=>{const v=g.map(K.f);return K.agg==="count"?g.length:K.agg==="sum"?v.reduce((a,b)=>a+b,0):avg(v)};const sfx=key==="rojo"||key==="expediente"?"%":"";
 const byC=M.coms.map(c=>{const g=M.all.filter(x=>x.comunidad===c&&M.okV(x)&&M.okR(x));return{l:c,raw:agg(g),n:g.length,fk:"celda:"+c+"|sol"}}).filter(x=>x.n).sort((a,b)=>b.raw-a.raw);const mx=Math.max(1,...byC.map(x=>x.raw));
 return `<h2 class="ftitle">${K.t}</h2><div class="fhero"><div><span class="k">${esc(M.nombre)}</span><span class="hv">${agg(M.scope)}${sfx}</span></div></div><p>${esc(K.def)}</p>
 ${fsec("Por comunidad",fBars(byC.map(x=>({l:x.l,v:key==="ise"||sfx?x.raw:Math.round(x.raw/mx*100),t:x.raw+sfx,c:key==="ise"?undefined:"var(--s1)",fk:x.fk}))))}${fsec("Cómo se calcula",`<p class="small">${esc(K.calc)}</p>`,false)}`}
function fSim(id){const x=cohorte().find(y=>y.id===id);if(!x)return '<p class="muted">Sin datos.</p>';
 return `<h2 class="ftitle">${esc(x.id)}</h2><p class="muted" style="margin:-4px 0 12px">${esc(x.comunidad)} · ${x.version==="adolescente"?"12–17":"18–45"} · ronda ${x.ronda}${x.live?"":" · persona simulada"}</p>
 <div class="fhero"><div><span class="k">ISE de soledad</span><div class="row" style="gap:10px;align-items:flex-end"><span class="hv">${x.sol}</span><span style="padding-bottom:8px">${lv(x.sol)}</span></div></div><div><span class="k">Ruta</span><span class="small">${x.f.alta?"Alta":x.f.seg?"En seguimiento":x.f.cita?"Cita agendada":x.f.exp?"Expediente abierto":"Solo cribado anónimo"}</span></div></div>
 ${fsec("Perfil por dimensión",fBars(focos(x.ice).map(d=>({l:d.n,v:x.ice[d.k],fk:"dim:"+d.k}))))}${x.live?`<button class="btn sm" data-fgo="pac:${esc(x.id)}">Abrir expediente en el panel clínico</button>`:'<p class="small muted">Sin expediente: solo existe como cribado anónimo en la simulación.</p>'}`}
document.addEventListener("click",e=>{if(e.target.closest("[data-fclose]")||e.target===SCRIM){closeFicha();return}
 const go=e.target.closest("[data-fgo]");if(go){const[t,...r]=go.dataset.fgo.split(":");const v=r.join(":");closeFicha();if(t==="com"){S.tb.com=v;go2("tablero")}else if(t==="pac"){S.ps.sel=v;S.ps.tab="resumen";go2("psicologo")}return}
 const f=e.target.closest("[data-ficha]");if(f&&(f.closest("#app")||f.closest("#ficha"))){e.preventDefault();openFicha(f.dataset.ficha,f);return}
 const sc=e.target.closest('[data-cross="scatter"]');if(sc&&S._near){if(S._near.p.live){S.ps.sel=S._near.p.id;go2("psicologo")}else openFicha("sim:"+S._near.p.id,sc)}});
function go2(v){if(bloqueado(v))return;S.view=v;try{history.replaceState(null,"","#"+v)}catch(_){}render();window.scrollTo(0,0)}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.ficha){closeFicha();return}if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".fk[data-ficha],rect.hit[data-ficha],circle[data-ficha],rect[data-ficha],path[data-ficha],td[data-ficha]")){e.preventDefault();openFicha(e.target.dataset.ficha,e.target)}});


/* ================= RENDER Y EVENTOS ================= */
function render(){document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.view===S.view));
 vtip.hidden=true;app.innerHTML=S.view==="usuario"?vUsuario():S.view==="psicologo"?vPsicologo():S.view==="tablero"?vTablero():vBanco();if(S.view==="tablero"||S.view==="psicologo")drawCharts();if(S.ficha)renderFicha()}
function go(v){if(bloqueado(v))return;S.view=v;try{history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo(0,0)}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(b)go(b.dataset.view)});
function nuevoFolio(){return "BW-26-"+(Date.now()%100000).toString().padStart(5,"0")}
async function finTest(){const F=S.flow;const ice=calcICE(F.resp);F.ev={fecha:new Date().toISOString().slice(0,10),tipo:"Cribado inicial",respuestas:{...F.resp},ice};F.folio=nuevoFolio();F.step="resultado";render();window.scrollTo(0,0);
 guardarExp({folio:F.folio,creado:new Date().toISOString(),version:F.version,comunidad:F.comunidad||null,nombre:null,estado:"Anónimo",evaluaciones:[F.ev]})}
function contestar(v){const F=S.flow;const ids=activosPara(F.version);F.resp[ids[F.idx]]=v;render();setTimeout(()=>{if(F.idx<ids.length-1){F.idx++;render()}else finTest()},170)}
app.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,v=t.dataset.v,F=S.flow;
 if(a==="ver"){F.version=v;render()}
 else if(a==="start"){F.comunidad=$("#comunidad").value;F.step="test";F.idx=0;F.resp={};render()}
 else if(a==="ans")contestar(+v);
 else if(a==="back"){if(F.idx>0){F.idx--;render()}else{F.step="inicio";render()}}
 else if(a==="goReg"){F.step="registro";render();window.scrollTo(0,0)}
 else if(a==="toStep"){F.step=t.dataset.s;render();window.scrollTo(0,0)}
 else if(a==="restart"){S.flow={step:"inicio",version:null,comunidad:"",idx:0,resp:{},folio:null,form:{},abiertas:{},dia:null,hora:null,modalidad:"En línea",chat:[],busy:false,crisis:false};render();window.scrollTo(0,0)}
 else if(a==="dia"){F.dia=v;F.hora=null;render()}
 else if(a==="hora"){F.hora=v;render()}
 else if(a==="mod"){F.modalidad=v;render()}
 else if(a==="confirmar"){F.cita={dia:F.dia,hora:F.hora,modalidad:F.modalidad};const rec=S.live[F.folio];if(rec){rec.cita=F.cita;rec.estado="Cita agendada";guardarExp(rec)}F.step="confirmado";render();window.scrollTo(0,0)}
 else if(a==="verPanel"){S.ps.sel=F.folio;go("psicologo")}
 else if(a==="pf"){S.ps.filtro=S.ps.filtro===v&&v!=="todos"?"todos":v;render()}
 else if(a==="ptab"){S.ps.tab=v;render();document.querySelector(".split section")?.scrollIntoView({behavior:"smooth",block:"start"})}
 else if(a==="tStart"){const T=S.ps.timer;if(T.acc>=1200000)T.acc=0;T.running=true;T.start=Date.now();render()}
 else if(a==="tPause"){const T=S.ps.timer;T.acc+=Date.now()-T.start;T.running=false;render()}
 else if(a==="tReset"){S.ps.timer={running:false,start:0,acc:0};render()}
 else if(a==="sesSave"){const txt=($("#ses-nota").value||"").trim();const qs=[0,1,2].filter(j=>$("#ses-q"+j)?.checked).map(j=>$("#ses-q"+j).nextElementSibling.textContent);const tarea=($("#ses-tarea").value||"").trim();
  if(!txt&&!qs.length){toast("Escribe una nota o marca las preguntas que trabajaron.");return}const dur=Math.max(1,Math.round(tElapsed()/60000));const foco=$("#ses-foco").value,dec=$("#ses-dec").value;
  (S.notas[v]=S.notas[v]||[]).push({fecha:new Date().toISOString().slice(0,10),foco,decision:dec,texto:(txt||"Sesión breve.")+(qs.length?" Preguntas trabajadas: "+qs.join(" | "):""),tarea,dur:S.ps.timer.acc||S.ps.timer.running?dur:undefined});
  const p=pacientes().find(x=>x.folio===v);if(p){p.estado=dec==="Alta"?"Alta":dec.startsWith("Escalar")?"Escalado":"En seguimiento";if(!p.demo)guardarExp(p)}guardarNotas(v);S.ps.timer={running:false,start:0,acc:0};S.ps.sesNota="";S.ps.tab="notas";render();toast("Sesión guardada en el expediente "+v)}
 else if(a==="psel"){S.ps.sel=v;S.ps.evFoco=null;S.ps.sesFoco=null;render();if(innerWidth<900)document.querySelector(".split section")?.scrollIntoView({behavior:"smooth"})}
 else if(a==="ai")genResumen(v);
 else if(a==="tx")analizarTx(v);
 else if(a==="nota"){const txt=$("#n-txt").value.trim();if(!txt){toast("Escribe la nota antes de guardarla.");return}(S.notas[v]=S.notas[v]||[]).push({fecha:new Date().toISOString().slice(0,10),foco:$("#n-foco").value,decision:$("#n-dec").value,texto:txt});
  const p=pacientes().find(x=>x.folio===v);const dec=$("#n-dec").value;const est=dec==="Alta"?"Alta":dec.startsWith("Escalar")?"Escalado":"En seguimiento";if(p){p.estado=est;if(!p.demo)guardarExp(p)}guardarNotas(v);render();toast("Nota guardada en el expediente "+v)}
 else if(a==="retest"){const p=pacientes().find(x=>x.folio===v);const e=ultima(p);const foco=(S.notas[v]||[]).slice(-1)[0]?.foco||focos(e.ice)[0].k;const R=rng(Date.now()%1e6);const resp={};
  for(const [id,val] of Object.entries(e.respuestas)){const q=QID[id];let r=riesgo(q,val);const baja=q.d===foco?(R()<.75?1:0)+(R()<.3?1:0):(R()<.35?1:0);r=Math.max(1,r-baja);resp[id]=crudo(q,r)}
  const last=new Date(e.fecha);const nf=new Date(Math.max(last.getTime()+7*864e5,Date.now())).toISOString().slice(0,10);p.evaluaciones=[...p.evaluaciones,{fecha:nf,tipo:"Pulso de seguimiento",respuestas:resp,ice:calcICE(resp)}];if(p.estado==="Anónimo"||p.estado==="Nuevo")p.estado="En seguimiento";
  if(!p.demo)guardarExp(p);render();toast("Nuevo pulso registrado · ISE soledad "+iceSol(calcICE(resp)))}
 else if(a==="tbr"){S.tb.ronda=v;render()}
 else if(a==="netm"){S.tb.net=v;render()}
 else if(a==="net3d"){S.tb.net3d=!S.tb.net3d;render()}
 else if(a==="netz"){if(S.tb.net3d&&S._n3){const st=S._n3.st;if(v==="reset"){st.ay=.4;st.ax=-.25;st.sc=st.sc0}else st.sc=Math.max(.5,Math.min(3,st.sc*(v==="in"?1.25:.8)))}else{const Z=S._netZoom;if(Z){v==="reset"?Z.svg.transition().duration(300).call(Z.zoom.transform,d3.zoomIdentity):Z.svg.transition().duration(250).call(Z.zoom.scaleBy,v==="in"?1.4:1/1.4)}}}
 else if(a==="tbv"){S.tb.ver=v;render()}
 else if(a==="tbl"){S.tb.tables[v]=!S.tb.tables[v];render()}
 else if(a==="hsort"){S.tb.sort=v;render()}
 else if(a==="verExp"){S.ps.sel=v;go("psicologo")}
 else if(a==="tbcom"){S.tb.com=S.tb.com===v?"todas":v;render()}
 else if(a==="bankReset"){S.banco.activos=DEFAULT_ACTIVOS.slice();guardarBanco();render();toast("Prueba corta restablecida a 20 preguntas")}
});
app.addEventListener("change",e=>{const t=e.target;
 if(t.id==="tb-com"){S.tb.com=t.value;render()}
 else if(t.dataset.act==="bankAct"){const id=+t.dataset.v;const st=new Set(S.banco.activos);t.checked?st.add(id):st.delete(id);S.banco.activos=[...st].sort((a,b)=>a-b);guardarBanco();render()}
 else if(t.dataset.bank){const id=t.dataset.v;const d=S.banco.decisiones[id]={...(S.banco.decisiones[id]||{})};d[t.dataset.bank]=t.value;guardarBanco();if(t.dataset.bank==="d")setTimeout(()=>{const a=document.activeElement;if(!a||!app.contains(a)||a===t)render()},0)}
});
app.addEventListener("submit",e=>{e.preventDefault();const F=S.flow;
 if(e.target.id==="regForm"){const f={nombre:$("#r-nombre").value.trim(),tel:$("#r-tel").value.trim(),correo:$("#r-correo").value.trim(),ok:$("#r-ok").checked,tutor:$("#r-tutor")?.checked};F.form=f;const err=$("#r-err");
  const m=!f.nombre?"Escribe tu nombre o cómo te gusta que te llamen.":!f.tel&&!f.correo?"Deja un teléfono o un correo para poder contactarte.":f.correo&&!/^\S+@\S+\.\S+$/.test(f.correo)?"Revisa el correo: parece incompleto.":!f.ok?"Necesitamos tu aceptación del aviso de privacidad.":F.version==="adolescente"&&!f.tutor?"En la versión adolescente se requiere que tu tutor esté de acuerdo.":"";
  if(m){err.textContent=m;err.hidden=false;return}
  const rec=S.live[F.folio]||{folio:F.folio,version:F.version,comunidad:F.comunidad||null,evaluaciones:[F.ev]};Object.assign(rec,{nombre:f.nombre,telefono:f.tel||null,correo:f.correo||null,estado:"Nuevo"});guardarExp(rec);F.step="hub";render();window.scrollTo(0,0)}
 else if(e.target.id==="preForm"){for(const k of F.preKeys){F.abiertas[k]=($("#ab-"+k)?.value||"").trim();if(CRISIS_RE.test(F.abiertas[k]))F.crisis=true}const rec=S.live[F.folio];if(rec){rec.abiertas={...F.abiertas};if(F.crisis)rec.alertaCrisis=true;guardarExp(rec)}F.step="agenda";render();window.scrollTo(0,0)}
 else if(e.target.id==="chatForm"){const i=$("#chatIn");const txt=i.value.trim();if(!txt||F.busy)return;i.value="";enviarChat(txt)}
});
app.addEventListener("keydown",e=>{if(e.target.id==="chatIn"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();e.target.form.requestSubmit()}});
document.addEventListener("keydown",e=>{if(S.view==="usuario"&&S.flow.step==="test"&&/^[1-5]$/.test(e.key)&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||""))contestar(+e.key)});
const h0=(location.hash||"").slice(1);if(["usuario","psicologo","tablero","banco"].includes(h0))S.view=h0;
if(MODO){S.view=MODO;$("#tabs").hidden=true;const mp=$("#modpill");mp.textContent=MOD_NOMBRE[MODO];mp.hidden=false}
render();
